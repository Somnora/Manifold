# The proof, on every push.
#
# Until 2026-08-14 the only workflow in this repo was `desktop`, which runs
# on tags. So nothing checked the test suite on a normal push, and the
# dashboard lockfile drifted out of sync for three weeks without anyone
# noticing: it passed on the author's npm 11 and failed on CI's npm 10, and
# the only job that would have caught it only ran on a release tag.
#
# This runs the two cheapest checks that would have caught that, plus the
# suite the README's claims rest on.
#
# ZERO SPEND BY CONSTRUCTION. The backend tests use MockLambdaClient
# exclusively (see CLAUDE.md); no cloud credentials are configured for this
# workflow, so a test that tried to reach a provider would fail rather than
# bill anyone.
name: test
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: backend
        run: uv sync --dev
      - name: Test
        working-directory: backend
        # Mocks only, no network, no spend. -q keeps the log readable; the
        # exit code is what gates the job.
        run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Pinned to the same major the desktop workflow uses, because the
        # lockfile has to satisfy the STRICTEST npm that touches it - npm 10
        # builds the full optional-dependency tree and npm 11 does not.
        # Bumping this without re-running `npm install --package-lock-only`
        # is how the break happened.
        with: { node-version: 22 }
      - name: Install from the lockfile
        working-directory: dashboard
        # `npm ci`, never `npm install`: this step exists to prove the
        # committed lockfile is complete and installable on a machine that
        # is not the author's.
        run: npm ci --no-fund --no-audit
      - name: Typecheck and build
        working-directory: dashboard
        run: npm run build

  # The only browser-level check in the repo. It exists because `tsc` and
  # `next build` both pass while a dialog is invisible: the Launch Swarm
  # modal was trapped inside a backdrop-blurred card (a CSS containing
  # block), clipped to a sliver and scrolling away with the page. Nothing
  # in the type system or the bundler can see that.
  #
  # playwright is installed ad hoc rather than added to package.json on
  # purpose: `npm ci` is the step that proves the committed lockfile is
  # installable, and a lockfile drifting out of sync is what kept this
  # repo's CI red for three weeks. This job must not put that at risk.
  modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the static export
        working-directory: dashboard
        run: npm ci --no-fund --no-audit && npm run build
      - name: Install a browser
        working-directory: dashboard
        run: |
          npm i --no-save --no-fund --no-audit playwright@1.62
          npx playwright install --with-deps chromium
      - name: Serve it and check the dialog escapes its parent
        working-directory: dashboard
        run: |
          npx --yes serve out -l 3111 >/dev/null 2>&1 &
          # Wait for the static server rather than sleeping a guessed number.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3111/ && break
            sleep 1
          done
          BASE=http://127.0.0.1:3111 node e2e/modal-portal.mjs

      # The job pipeline needs a backend with tasks in it, so it runs
      # against mock mode on the port the export expects (3000). Seeded
      # demo history gives the graph something to lay out.
      - name: Check the job pipeline lays out and fits
        run: |
          cd backend && uv sync --dev >/dev/null 2>&1 || true
          MANIFOLD_MOCK=1 MANIFOLD_MOCK_SEED_DAYS=2 \
            uv run uvicorn app.main:create_default_app --factory --port 8000 \
            >/dev/null 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8000/health && break
            sleep 1
          done
          cd ../dashboard
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out \
            >/dev/null 2>&1 &
          # Seed real tasks: MOCK_SEED_DAYS fabricates LAUNCH history, not
          # tasks, so without this the panel renders its empty state and
          # the check fails on a missing canvas rather than on a bug.
          # Six independent (enough for the grid to wrap) plus one chain,
          # so the arrow assertions have something to measure.
          first=""
          for i in 1 2 3 4 5 6; do
            id=$(curl -sf -X POST http://127.0.0.1:8000/tasks \
                   -H 'content-type: application/json' \
                   -d '{"template":"gpu-smoke","parameters":{}}' \
                 | python3 -c 'import sys,json;print(json.load(sys.stdin)["task"]["id"])')
            [ -z "$first" ] && first="$id"
          done
          curl -sf -X POST http://127.0.0.1:8000/tasks \
            -H 'content-type: application/json' \
            -d "{\"template\":\"gpu-smoke\",\"parameters\":{},\"depends_on\":[\"$first\"]}" \
            >/dev/null
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          node e2e/job-pipeline.mjs
