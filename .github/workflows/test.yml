# The proof, on every push.
#
# Until 2026-08-14 the only workflow in this repo was `desktop`, which runs
# on tags. So nothing checked the test suite on a normal push, and the
# dashboard lockfile drifted out of sync for three weeks without anyone
# noticing: it passed on the author's npm 11 and failed on CI's npm 10, and
# the only job that would have caught it only ran on a release tag.
#
# This runs the two cheapest checks that would have caught that, plus the
# suite the README's claims rest on.
#
# ZERO SPEND BY CONSTRUCTION. The backend tests use MockLambdaClient
# exclusively (see CLAUDE.md); no cloud credentials are configured for this
# workflow, so a test that tried to reach a provider would fail rather than
# bill anyone.
name: test
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Every job here finishes in minutes when healthy. Without a ceiling, a
    # wedged step runs until GitHub's 6-hour kill: the modal job's browser
    # install hung twice on 2026-08-18, and the second hang held a release
    # commit's run open for exactly 6h00m before the platform cancelled it.
    # These limits are ~3x the observed worst case, so they only ever fire
    # on a wedge - and then within minutes, not hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: backend
        run: uv sync --dev
      - name: Test
        working-directory: backend
        # Mocks only, no network, no spend. -q keeps the log readable; the
        # exit code is what gates the job.
        run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Pinned to the same major the desktop workflow uses, because the
        # lockfile has to satisfy the STRICTEST npm that touches it - npm 10
        # builds the full optional-dependency tree and npm 11 does not.
        # Bumping this without re-running `npm install --package-lock-only`
        # is how the break happened.
        with: { node-version: 22 }
      - name: Install from the lockfile
        working-directory: dashboard
        # `npm ci`, never `npm install`: this step exists to prove the
        # committed lockfile is complete and installable on a machine that
        # is not the author's.
        run: npm ci --no-fund --no-audit
      - name: Typecheck and build
        working-directory: dashboard
        run: npm run build

  # The only browser-level check in the repo. It exists because `tsc` and
  # `next build` both pass while a dialog is invisible: the Launch Swarm
  # modal was trapped inside a backdrop-blurred card (a CSS containing
  # block), clipped to a sliver and scrolling away with the page. Nothing
  # in the type system or the bundler can see that.
  #
  # playwright is installed ad hoc rather than added to package.json on
  # purpose: `npm ci` is the step that proves the committed lockfile is
  # installable, and a lockfile drifting out of sync is what kept this
  # repo's CI red for three weeks. This job must not put that at risk.
  modal:
    runs-on: ubuntu-latest
    # Normal runtime is 4-6 minutes; the browser-install step is the one
    # that wedges (see the note on `backend`).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The pipeline check drives the UI against a real backend, so this
      # job needs uv too. Without it the backend never started, the seeding
      # curl hit nothing, and the step died on a JSON parse error three
      # commands downstream of the actual cause.
      #
      # Cache off: setup-uv's post-job cache prune ran while the
      # backgrounded uvicorn still held the cache and failed with exit 2 -
      # every real step green, the job red on cleanup. The backend is also
      # killed at the end of its step now, but a cleanup that CAN fail the
      # job buys nothing here worth that risk.
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: false }
      - name: Build the static export
        working-directory: dashboard
        run: npm ci --no-fund --no-audit && npm run build
      - name: Install a browser
        working-directory: dashboard
        run: |
          npm i --no-save --no-fund --no-audit playwright@1.62
          npx playwright install --with-deps chromium
      - name: Serve it and check the dialog escapes its parent
        working-directory: dashboard
        run: |
          npx --yes serve out -l 3111 >/dev/null 2>&1 &
          # Wait for the static server rather than sleeping a guessed number.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3111/ && break
            sleep 1
          done
          BASE=http://127.0.0.1:3111 node e2e/modal-portal.mjs

      # The job pipeline needs a backend with tasks in it, so it runs
      # against mock mode on the port the export expects (3000). Seeded
      # demo history gives the graph something to lay out.
      - name: Check the job pipeline lays out and fits
        run: |
          cd backend
          uv sync --dev
          MANIFOLD_MOCK=1 \
            uv run uvicorn app.main:create_default_app --factory --port 8000 \
            > /tmp/manifold-backend.log 2>&1 &
          up=""
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8000/health && { up=1; break; }
            sleep 1
          done
          # Fail HERE, naming the cause, rather than sliding into a seeding
          # error that points at the wrong thing.
          if [ -z "$up" ]; then
            echo "backend never came up; its log:" >&2
            tail -30 /tmp/manifold-backend.log >&2
            exit 1
          fi
          cd ../dashboard
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out \
            >/dev/null 2>&1 &
          # Seed real tasks: MOCK_SEED_DAYS fabricates LAUNCH history, not
          # tasks, so without this the panel renders its empty state and
          # the check fails on a missing canvas rather than on a bug.
          # Six independent (enough for the grid to wrap) plus one chain,
          # so the arrow assertions have something to measure.
          first=""
          for i in 1 2 3 4 5 6; do
            id=$(curl -sf -X POST http://127.0.0.1:8000/tasks \
                   -H 'content-type: application/json' \
                   -d '{"template":"gpu-smoke","parameters":{}}' \
                 | python3 -c 'import sys,json;print(json.load(sys.stdin)["task"]["id"])')
            [ -z "$first" ] && first="$id"
          done
          curl -sf -X POST http://127.0.0.1:8000/tasks \
            -H 'content-type: application/json' \
            -d "{\"template\":\"gpu-smoke\",\"parameters\":{},\"depends_on\":[\"$first\"]}" \
            >/dev/null
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          node e2e/job-pipeline.mjs
          # The backend must not outlive the step: a uv-spawned process
          # alive at post-job time is what broke the action's cleanup.
          pkill -f "uvicorn app.main" || true

      # "No agent connected" is the one state a developer machine cannot
      # show you: the chip fires only at ZERO all-time `mcp` audit rows,
      # and any backend that has ever been driven by an agent has some.
      # It shipped in the v0.2.2 installers verified by a typecheck alone.
      # CI is the natural home for it, because a fresh runner is the only
      # place a virgin audit log happens for free.
      - name: Check the dashboard says when no agent has ever connected
        run: |
          cd backend
          # The previous step's `pkill` does not WAIT for the process to go,
          # so :8000 can still be held when we arrive. Our uvicorn then dies
          # on bind, while the health check below passes against the OLD
          # backend on its way out - and node reaches a port with nothing
          # behind it. That is exactly how this step failed its first time on
          # main: 0.6 seconds from start to ECONNREFUSED, no wait, no error.
          # Reap it and wait for the port to actually go quiet.
          pkill -f "uvicorn app.main" || true
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/health || break
            sleep 1
          done
          # A scratch data dir, not the checkout: the previous step's
          # backend wrote tasks and audit rows into the repo root, and this
          # check's whole precondition is an audit log with nothing in it.
          # (No mcp rows either way - tasks are posted as `api` - but a
          # precondition worth asserting is worth guaranteeing.)
          export MANIFOLD_DATA_DIR="$(mktemp -d)"
          MANIFOLD_MOCK=1 MANIFOLD_NO_BREADCRUMB=1 \
            uv run uvicorn app.main:create_default_app --factory --port 8000 \
            > /tmp/manifold-agent-check.log 2>&1 &
          backend=$!
          up=""
          for i in $(seq 1 60); do
            # OURS must be alive, not merely something answering on the port.
            # Without this the health check can be satisfied by a backend we
            # did not start and are about to lose.
            kill -0 "$backend" 2>/dev/null || break
            curl -sf -o /dev/null http://127.0.0.1:8000/health && { up=1; break; }
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "our backend never came up; its log:" >&2
            tail -30 /tmp/manifold-agent-check.log >&2
            exit 1
          fi
          cd ../dashboard
          # Port 3000 exactly. The export talks to :8000 only when served
          # there; anywhere else it calls ITSELF, every request dies at the
          # CORS preflight, and the chip renders nothing - which is
          # indistinguishable from the bug this check exists to catch.
          # The previous step left a server on 3000; start one only if not.
          if ! curl -sf -o /dev/null http://127.0.0.1:3000/; then
            python3 -m http.server 3000 --bind 127.0.0.1 --directory out \
              >/dev/null 2>&1 &
          fi
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          API=http://127.0.0.1:8000 SITE=http://127.0.0.1:3000 \
            node e2e/agent-connection.mjs
          pkill -f "uvicorn app.main" || true

      # The freeze, as an assertion. usePolling had no in-flight guard and
      # lib/api.ts waits 30s before giving up, so a slow backend made every
      # hook queue a fetch per interval while none finished - arrivals
      # outran completions and the queue grew past the browser's ~6
      # connections per origin, where a click's fetch starts waiting behind
      # polls. Three reports of "it freezes after I step away, I have to
      # restart it" and nothing in the type system can see any of it.
      #
      # This is the only check in the repo that measures BEHAVIOR OVER TIME
      # rather than a rendered state, so it is also the only one that costs
      # a minute of wall clock. It stays because the bug it catches is the
      # one users actually hit.
      - name: Check a stalled backend does not pile up polls
        run: |
          cd backend
          pkill -f "uvicorn app.main" || true
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/health || break
            sleep 1
          done
          export MANIFOLD_DATA_DIR="$(mktemp -d)"
          MANIFOLD_MOCK=1 MANIFOLD_NO_BREADCRUMB=1 \
            uv run uvicorn app.main:create_default_app --factory --port 8000 \
            > /tmp/manifold-pileup.log 2>&1 &
          backend=$!
          up=""
          for i in $(seq 1 60); do
            kill -0 "$backend" 2>/dev/null || break
            curl -sf -o /dev/null http://127.0.0.1:8000/health && { up=1; break; }
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "our backend never came up; its log:" >&2
            tail -30 /tmp/manifold-pileup.log >&2
            exit 1
          fi
          # The Jobs page renders its empty state without tasks, which mounts
          # fewer hooks - and this check's preconditions assert that several
          # are live, so it would fail on a missing fixture rather than a bug.
          for i in 1 2 3 4 5 6; do
            curl -sf -X POST http://127.0.0.1:8000/tasks \
              -H 'content-type: application/json' \
              -d '{"template":"gpu-smoke","parameters":{}}' -o /dev/null
          done
          cd ../dashboard
          if ! curl -sf -o /dev/null http://127.0.0.1:3000/; then
            python3 -m http.server 3000 --bind 127.0.0.1 --directory out \
              >/dev/null 2>&1 &
          fi
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          # No API=: the export is built with no NEXT_PUBLIC_API_URL, so it
          # calls the `http://localhost:8000` default baked in by
          # lib/backend.ts - NOT the 127.0.0.1 spelling this job serves on.
          # Passing the wrong one is how this check first measured zero
          # traffic, twice. It finds the backend in the page's own requests.
          SITE=http://127.0.0.1:3000 node e2e/poll-pileup.mjs
          pkill -f "uvicorn app.main" || true

      # The other half of the same freeze. Phase 91 parked a dropped shell
      # for 8 hours; nothing went back for it, so the grace bought nothing a
      # user could see and a dead rectangle was still the whole experience.
      # This drives a REAL pty through a real drop and a real `exit`, which
      # is the only way to tell "reattached to the same shell" from "started
      # a new one that looks the same".
      - name: Check a dropped terminal reattaches to its shell
        run: |
          cd backend
          pkill -f "uvicorn app.main" || true
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/health || break
            sleep 1
          done
          export MANIFOLD_DATA_DIR="$(mktemp -d)"
          MANIFOLD_MOCK=1 MANIFOLD_NO_BREADCRUMB=1 \
            uv run uvicorn app.main:create_default_app --factory --port 8000 \
            > /tmp/manifold-terminal.log 2>&1 &
          backend=$!
          up=""
          for i in $(seq 1 60); do
            kill -0 "$backend" 2>/dev/null || break
            curl -sf -o /dev/null http://127.0.0.1:8000/health && { up=1; break; }
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "our backend never came up; its log:" >&2
            tail -30 /tmp/manifold-terminal.log >&2
            exit 1
          fi
          cd ../dashboard
          if ! curl -sf -o /dev/null http://127.0.0.1:3000/; then
            python3 -m http.server 3000 --bind 127.0.0.1 --directory out \
              >/dev/null 2>&1 &
          fi
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          SITE=http://127.0.0.1:3000 node e2e/terminal-reconnect.mjs
          pkill -f "uvicorn app.main" || true
