# Desktop builds: .dmg (macOS arm64) and .msi (Windows x64) on demand or tag.
#
# Unsigned by design for now - signing needs org secrets:
#   macOS: Developer ID cert + notarization (APPLE_CERT*, APPLE_ID...)
#   Windows: Authenticode cert
# Wire those into the tauri-action step when the accounts exist
# (docs/desktop-build.md).
name: desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: dmg
          - os: windows-2022
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build backend binary (dashboard export + PyInstaller)
        shell: bash
        run: ./scripts/build-backend.sh

      - name: Stage sidecar for Tauri
        shell: bash
        # Onedir layouts differ per platform (shim on macOS, adjacency on
        # Windows) - the script is the single place that knows the shape.
        run: |
          cd desktop && npm ci --no-fund --no-audit
          cd .. && ./scripts/stage-sidecar.sh

      - name: Tauri build
        shell: bash
        run: cd desktop && npx tauri build --bundles ${{ matrix.bundles }}

      # The regression this packaging exists to prevent is a bridge that
      # cannot answer an MCP client. Prove the BUILT bundle end to end on
      # the runner: spawn the app's own sidecar path (the shim) exactly as
      # Claude Desktop would and require the JSON-RPC handshake to answer.
      # macOS only - the msi cannot be installed on the build runner.
      - name: Handshake against the built bundle (macOS)
        if: matrix.bundles == 'dmg'
        shell: bash
        run: |
          app=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app produced" >&2; exit 1; }
          "$app/Contents/MacOS/manifold-backend" --doctor --handshake

      - uses: actions/upload-artifact@v4
        with:
          name: manifold-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi

  # Only on a version tag (not workflow_dispatch): publish both platform
  # builds as ONE public GitHub Release with a stable, shareable link -
  # https://github.com/<org>/<repo>/releases/latest - instead of the
  # login-gated, 90-day-expiring build artifacts above.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # find, not a glob. upload-artifact@v4 keeps the common ancestor of
          # its `path:` patterns, so the installers land at
          # dist/<artifact>/dmg/*.dmg and dist/<artifact>/msi/*.msi - one level
          # deeper than dist/<artifact>/*.dmg. The v0.2.0 tag build produced
          # both installers and then failed here with "no matches found",
          # after seven minutes of CI. A recursive find does not care how the
          # action nests them.
          mapfile -t installers < <(find dist -type f \( -name '*.dmg' -o -name '*.msi' \) | sort)
          printf 'publishing %s\n' "${installers[@]}"
          test "${#installers[@]}" -ge 2 || { echo "expected a .dmg AND a .msi, found ${#installers[@]}" >&2; exit 1; }
          gh release create "${{ github.ref_name }}" \
            "${installers[@]}" \
            --repo "${{ github.repository }}" \
            --title "Manifold ${{ github.ref_name }}" \
            --notes "Unsigned builds: macOS shows an \"unidentified developer\" warning (right-click the app -> Open); Windows shows a SmartScreen warning (More info -> Run anyway). See docs/desktop-build.md."
