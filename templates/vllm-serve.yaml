# Serve a model with vLLM's OpenAI-compatible server.
# Supports single model serving, multi-LoRA subagent swarms, and speculative decoding.
# The port is bound to 127.0.0.1 on the instance by the dispatcher; reach it
# from your machine through the backend's SSH port forward.
name: vllm-serve
description: Serve a model with vLLM (OpenAI-compatible API on a loopback port). Supports multi-LoRA subagent personas and speculative decoding draft models. Standard HF Transformers repos or local paths only.
image: vllm/vllm-openai:latest

# The image's own ENTRYPOINT is `vllm serve` and would consume this
# command as its ARGUMENTS (our -c became --compilation-config at the
# 2026-08-14 real gate). entrypoint: python3 makes the bootstrap below
# actually run.
entrypoint: python3

command: >
  -c 'import os, sys, subprocess

  (model_id, max_context, port, tensor_parallel, tool_call_parser,
   enable_lora, max_loras, max_cpu_loras, lora_modules, max_lora_rank,
   speculative_model, num_speculative_tokens) = sys.argv[1:13]

  cmd = [
      "vllm", "serve", model_id,
      "--max-model-len", max_context,
      "--port", port,
      "--tensor-parallel-size", tensor_parallel,
      "--enable-auto-tool-choice",
      "--tool-call-parser", tool_call_parser,
  ]

  if str(enable_lora).lower() in ("true", "1", "yes"):
      cmd.append("--enable-lora")
      if max_loras and str(max_loras).isdigit() and int(max_loras) > 0:
          cmd.extend(["--max-loras", str(max_loras)])
      if max_cpu_loras and str(max_cpu_loras).isdigit() and int(max_cpu_loras) > 0:
          cmd.extend(["--max-cpu-loras", str(max_cpu_loras)])
      if max_lora_rank and str(max_lora_rank).isdigit() and int(max_lora_rank) > 0:
          cmd.extend(["--max-lora-rank", str(max_lora_rank)])
      if lora_modules and str(lora_modules).strip():
          for module in str(lora_modules).replace(",", " ").split():
              if module.strip():
                  cmd.extend(["--lora-modules", module.strip()])

  if speculative_model and str(speculative_model).strip():
      cmd.extend(["--speculative-model", str(speculative_model).strip()])
      if num_speculative_tokens and str(num_speculative_tokens).isdigit():
          cmd.extend(["--num-speculative-tokens", str(num_speculative_tokens)])

  joined = " ".join(cmd)

  print(f"manifold: launching vllm -> {joined}", flush=True)

  os.execvp(cmd[0], cmd)
  ' {{model_id}} {{max_context}} {{port}} {{tensor_parallel}} {{tool_call_parser}} {{enable_lora}} {{max_loras}} {{max_cpu_loras}} {{lora_modules}} {{max_lora_rank}} {{speculative_model}} {{num_speculative_tokens}}

parameters:
  - name: model_id
    type: string
    description: HuggingFace model id to serve (e.g. Qwen/Qwen2.5-7B-Instruct), or a local path like /data/models/merged for a model produced by lora-merge
  - name: max_context
    type: integer
    default: 8192
    description: Maximum context length in tokens
  - name: port
    type: integer
    default: 8080
    description: Container port for the API server (loopback-only on the host)
  - name: tensor_parallel
    type: integer
    default: 1
    description: Shard the model across this many GPUs (set to 8 on an 8x cluster for big MoE models)
  - name: tool_call_parser
    type: string
    default: hermes
    description: Tool-call format parser, needed for structured output / agent frameworks. hermes fits Qwen and Hermes models; use mistral or llama3_json for those families.
  - name: enable_lora
    type: boolean
    default: false
    description: Enable multi-LoRA serving to dynamically serve multiple subagent adapter personas on top of a single base model.
  - name: max_loras
    type: integer
    default: 4
    description: Maximum number of LoRA adapters to serve concurrently when enable_lora is true.
  - name: max_cpu_loras
    type: integer
    default: 8
    description: Maximum number of LoRA adapters to cache in CPU memory when enable_lora is true.
  - name: lora_modules
    type: string
    default: ""
    description: Optional pre-loaded LoRA adapters (space or comma-separated name=path pairs, e.g. coder=/data/outputs/distill-v1).
  - name: max_lora_rank
    type: integer
    default: 64
    description: Maximum rank for LoRA adapters.
  - name: speculative_model
    type: string
    default: ""
    description: Optional draft model ID or local path for speculative decoding to accelerate token generation.
  - name: num_speculative_tokens
    type: integer
    default: 5
    description: Number of speculative tokens to sample per draft step when speculative_model is set.

volumes:
  # HuggingFace cache on persistent storage: models survive the instance.
  - host: "{persistent}/cache/huggingface"
    container: /root/.cache/huggingface
  # Locally-produced HF models (e.g. from lora-merge) live here; serve one by
  # path with model_id=/data/models/<name>. Read-only: serving never writes.
  - host: "{persistent}/models"
    container: /data/models
    read_only: true
  # Finetuned LoRA adapters (e.g. from axolotl-finetune) live here; serve adapters
  # by path e.g. lora_modules="coder=/data/outputs/distill-v1". Read-only.
  - host: "{persistent}/outputs"
    container: /data/outputs
    read_only: true

ports:
  - host: 8080
    container: 8080

env:
  VLLM_NO_USAGE_STATS: "1"

gpu:
  min_vram_gib: 24
  recommended_types:
    - gpu_1x_a10
    - gpu_1x_h100_pcie
    - gpu_1x_h100_sxm5
