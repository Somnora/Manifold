# Start a Ray head node for distributed compute on a single instance.
# Loopback-safe: no host networking, and the dashboard binds to 127.0.0.1, so
# nothing here can listen on a public interface (hard rule). Without host
# networking the GCS and dashboard ports stay container-internal.
# Multi-node join (role=worker) needs head-IP discovery and inter-node comms
# over the managed SSH tunnel, which is not wired yet: a worker exits with a
# clear error instead of silently opening the network (phase 2 work).
name: ray-cluster
description: Start a Ray head node for distributed GPU compute on a single instance. Multi-node worker join is not yet supported.
image: rayproject/ray:latest-gpu

command: >
  python3 -c 'import os, sys

  role, head_ip, ray_port, dashboard_port, num_gpus = sys.argv[1:6]

  if role.lower() != "head":
      print("manifold error: multi-node Ray join (role=worker) is not yet supported; run role=head for a single-node cluster", file=sys.stderr)
      sys.exit(1)

  cmd = [
      "ray", "start", "--head",
      f"--port={ray_port}",
      "--dashboard-host=127.0.0.1",
      f"--dashboard-port={dashboard_port}",
      "--block",
  ]

  if num_gpus and str(num_gpus).isdigit() and int(num_gpus) > 0:
      cmd.append(f"--num-gpus={num_gpus}")

  joined = " ".join(cmd)

  print(f"manifold: launching ray {role} node -> {joined}", flush=True)

  os.execvp(cmd[0], cmd)
  ' manifold {{role}} {{head_ip}} {{ray_port}} {{dashboard_port}} {{num_gpus}}

parameters:
  - name: role
    type: string
    default: head
    description: Role of this Ray node. Only 'head' (single-node) works today; 'worker' exits with an error until multi-node join is wired up.
  - name: head_ip
    type: string
    default: ""
    description: Reserved for multi-node join (not yet supported). Leave empty.
  - name: ray_port
    type: integer
    default: 6379
    description: Ray GCS port. Container-internal; nothing is published on the instance.
  - name: dashboard_port
    type: integer
    default: 8265
    description: Ray dashboard port, bound to 127.0.0.1 inside the container.
  - name: num_gpus
    type: integer
    default: 8
    description: Number of GPUs on this node to expose to Ray.

volumes:
  - host: "{persistent}/cache/huggingface"
    container: /root/.cache/huggingface
  - host: "{persistent}/ray_data"
    container: /tmp/ray
