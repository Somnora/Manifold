# Manifold tunables. Secrets do NOT go here — they live in .env.

guardrails:
  # Hard limits enforced BEFORE any launch API call. A launch that would
  # exceed either limit is rejected outright, never queued.
  max_concurrent_instances: 1
  max_hourly_spend_usd: 4.00

launch:
  # Lambda frequently returns insufficient-capacity. One "attempt" tries the
  # requested type plus each fallback type once, in order; between attempts
  # we back off exponentially (base * 2^n, capped at max).
  max_attempts: 5
  backoff_base_seconds: 5
  backoff_max_seconds: 120
  # Ordered fallback instance types tried when the requested type has no
  # capacity, e.g. [gpu_1x_a10, gpu_1x_a100_sxm4]. Each fallback must still
  # pass the budget guard or it is skipped.
  fallback_instance_types: []
  # How long to wait for a launched instance to reach "active" with an IP.
  # SXM4/large multi-GPU boots routinely run 15-30+ min on Lambda's side;
  # 900s cut those off mid-boot. 2400s (40 min) covers the observed worst case.
  boot_timeout_seconds: 2400
  boot_poll_seconds: 10
  # The SECOND window, and a separate budget on purpose. The one above ends
  # when the provider says the instance is RUNNING; this one covers what
  # happens next - SSH comes up, then cloud-init installs the NVIDIA driver,
  # Docker, the container runtime and the sidecar. On a stock-Ubuntu GCE T4
  # that is RUNNING at ~36s, sshd at ~90s and provisioned at ~7 minutes, so
  # a launch marked "ready" at 36s handed out a machine that could not run a
  # single job. Folding this tail into boot_timeout_seconds instead would
  # make today's successful 40-minute Lambda boots start failing.
  #
  # Measured from the first moment SSH answers (connected_at on the launch
  # row). When it runs out the launch FAILS and says so - the instance is
  # never destroyed, because a box whose sidecar never came up is a box
  # nothing can be rescued from.
  provisioning_timeout_seconds: 1200
  # How often to sweep for active instances with no managed connection
  # (launched from the Lambda console, a raw API script, or while the
  # backend was down) and connect to them. 0 disables the sweep.
  adopt_poll_seconds: 30

ssh:
  # Name of the SSH key as registered with Lambda (GET /ssh-keys),
  # and the matching private key on this machine.
  key_name: "lambda-burst-ed25519"
  private_key_path: ~/.ssh/lambda_burst_ed25519
  username: ubuntu
  connect_timeout_seconds: 15
  # Managed-connection reconnect backoff (base * 2^n, capped).
  reconnect_base_seconds: 1
  reconnect_max_seconds: 30
  # Liveness pings on the managed connection: drop and reconnect after
  # ~interval * count_max of silence (~45s), instead of waiting the ~15 min
  # the OS takes to notice a dead TCP path.
  keepalive_interval_seconds: 15
  keepalive_count_max: 3
  # Ceiling on a single remote command (sidecar-less shell calls: diagnose,
  # etc.). A stalled NFS mount can't wedge a request forever. Sync/archive
  # pass their own longer bounds; job dispatch streams unbounded by design.
  command_timeout_seconds: 120

connection:
  # direct-ssh (default) or tailscale. Overridable per launch.
  default_mode: direct-ssh

tasks:
  # How often the dispatcher looks for queued tasks and a connected instance.
  poll_seconds: 1.0
  # First-job GPU preflight. A100 SXM boxes cannot initialize CUDA until
  # nvidia-fabricmanager finishes starting (minutes after boot, while
  # nvidia-smi already looks fine) - a job dispatched in that window dies
  # with "No CUDA GPUs are available" after burning billed minutes. The
  # dispatcher waits (up to the timeout) for the fabric state to settle
  # before the FIRST job on each instance, then dispatches anyway.
  gpu_ready_timeout_seconds: 180
  gpu_ready_poll_seconds: 10

idle:
  # No running job and no terminal activity for this long -> the backend
  # requests termination through the standard flow (safety hook included).
  # The instance card shows the countdown and a per-instance "Keep alive"
  # switch. 300s proved brutal during interactive testing (it terminated
  # an instance mid-session); 30 minutes is the interactive-friendly default.
  timeout_seconds: 1800
  poll_seconds: 15

  # GPU utilization that counts as "this box is working", whatever Manifold
  # saw of the traffic driving it. The idle timeout above only ever measured
  # traffic that came THROUGH Manifold - jobs, the terminal, the chat panel,
  # the OpenAI proxy - so a model served over your own SSH tunnel, or a
  # detached training run, looked abandoned while pinning the card. That
  # cost a real run: an instance was reaped for "idle 1811s" in the same
  # second its telemetry recorded 100% utilization and 36GB of VRAM held.
  #
  # A card doing nothing reports 0-2%, so 10 clears noise. This NARROWS the
  # reaper rather than loosening it - a genuinely abandoned box still reads
  # near zero and is still terminated on schedule, and utilization is checked
  # over the whole idle window because instantaneous readings swing between
  # 0 and 100 on a busy box. VRAM is deliberately NOT consulted: a loaded
  # model answering nobody is exactly what should be reaped.
  #
  # Set to 0 to switch the check off and judge by Manifold-visible traffic
  # alone. Not a substitute for a max_lifetime ceiling: nothing here bounds
  # a job that stays busy forever.
  busy_util_pct: 10

  # The max-lifetime ceiling (opt-in, per launch; unset = no ceiling, and
  # that is the default). Unlike the idle timeout it is measured from the
  # moment the provider ACCEPTS the launch and nothing running on the box can
  # push it out - not a served model, not a busy terminal, not a restart.
  #
  # The floor is not the idle floor: the clock starts BEFORE boot, and boot
  # is 15-40 minutes on a multi-GPU instance, so a short ceiling would
  # destroy an expensive box the moment it became usable. Left unset it is
  # computed as launch.boot_timeout_seconds + idle.timeout_seconds (4200s).
  # A request under the floor is REJECTED, never quietly raised.
  # max_lifetime_min_seconds: 4200
  max_lifetime_max_seconds: 2592000     # 30 days
  # How long before the ceiling you get one heads-up. A fixed lead, not a
  # percentage: 90% of 30 days is three days of nagging, 90% of 70 minutes is
  # seven minutes of notice. Suppressed when the ceiling is under 2x this.
  ceiling_warning_seconds: 600

autopilot:
  # Agent runs: a model (GPU-served, local, or frontier API) drives
  # Manifold's guarded operations. Every launch/terminate still passes the
  # same guards.
  max_steps_default: 20     # steps per run unless the request says otherwise
  max_steps_cap: 50         # hard ceiling no request can exceed
  wait_cap_seconds: 120     # longest single "wait" action the agent may take
  chat_timeout_seconds: 300 # per-turn timeout talking to the brain model
  # Approval-gated runs: how long a paused launch/run_job/terminate waits
  # for your Approve/Deny before auto-denying (the run adapts, not dies).
  approval_timeout_seconds: 600

preferences:
  # DEFAULTS for the three policies you can also change on the Settings page.
  # Changing them there stores your choice in the database and overrides what
  # is written here (a UI must not rewrite a commented YAML file). Editing
  # this file changes the defaults a fresh install starts with.

  approvals:
    # Which autopilot actions pause for your Approve/Deny.
    #
    # This is a MONEY decision, not a caution decision. An approval nobody
    # answers auto-denies after autopilot.approval_timeout_seconds, so gating
    # an action means "if I am away from my desk, this does not happen":
    #
    #   launch_gpu         not launching costs $0.            <- safe to gate
    #   terminate_instance NOT terminating keeps billing.     <- gating this
    #                      loses money exactly when you are away, which is
    #                      when autopilot runs. Leave it off.
    #   run_job            not running leaves a paid GPU idle. Same logic.
    launch_gpu: true
    run_job: false
    terminate_instance: false

  notifications:
    # A paused approval nobody hears about is a stall, not a safeguard.
    approval_requested: true
    job_succeeded: true
    job_failed: true
    run_finished: true       # an autopilot run ended
    data_transferred: true   # files were rescued off an instance
    capacity_available: true # a capacity watch found its GPU
    instance_idle: true      # a running instance is billing while barely used
    # A heads-up before the max-lifetime ceiling fires, and the cases where
    # it fired but Manifold deliberately did NOT destroy the box. Separate
    # from instance_idle so silencing idle chatter cannot also silence the
    # warning that a box is about to be terminated.
    instance_ceiling: true
    # Month-to-date spend crossing a share of the monthly budget. The budget
    # never blocks a launch, so this notification IS the feature.
    budget_threshold: true
    # Also raise a real OS notification (macOS Notification Center,
    # notify-send on Linux) so it reaches you outside the window. In-app
    # notifications are recorded either way.
    desktop: true

  data_safety:
    # What happens to files on an instance's scratch disk when it is torn
    # down. That disk dies with the instance; the persistent filesystem
    # survives. Termination RESCUES first, then re-checks.
    #
    # WHERE the data goes (both may be on):
    to_filesystem: true    # rsync scratch to the Lambda persistent volume.
                           # Datacenter-local, so effectively free and total.
    to_local: false        # also pull the files down to THIS machine over the
                           # managed SSH connection. Costs real transfer time
                           # while the GPU bills, so it is off by default and
                           # budgeted below.
    local_dir: "~/Manifold/rescued"
    max_local_gib: 25.0    # ceiling on one instance's download. Files that do
                           # not fit are SKIPPED and reported, never silently
                           # dropped.
    # WHAT is worth rescuing:
    #   all      every file the sidecar flags as valuable
    #   outputs  only a job's deliverables (outputs/...), leaving multi-GB
    #            checkpoints and caches behind
    scope: all
    # And the one that actually matters: what if a file could NOT be saved?
    #   block      keep the instance alive with the data intact and ping you.
    #              The GPU keeps billing, but data loss is unrecoverable and a
    #              billing hour is not.
    #   terminate  stop the billing and let those files die. Recorded in the
    #              audit log and the notification, never silent.
    if_unsaveable: block

  guardrails:
    # User-editable overrides for the hard limits at the top of this file.
    # 0 means "not set here, use the value above", so the Settings page can
    # raise the instance limit without a YAML edit and a restart.
    max_concurrent_instances: 0
    max_hourly_spend_usd: 0.0
    # A CUMULATIVE wallet for the calendar month. Different in kind from the
    # two above: those are RATE ceilings the orchestrator enforces before a
    # launch, this one is only ever REPORTED. Month-to-date is reconstructed
    # from the launches Manifold started, so it is a lower bound (an instance
    # launched from the provider's console is invisible to it), and refusing
    # work on a number we know is short would cost you a launch without
    # protecting the wallet. 0 = no budget set.
    monthly_budget_usd: 0.0

  providers:
    # Which cloud a launch lands on when the caller does not name one.
    # Agents, the MCP bridge and the launch form all follow it, so moving a
    # project to another cloud (Lambda credits running low, say) is one
    # choice here instead of a change of habit for every agent.
    #
    # A launch that DOES name a provider always wins, and the background
    # loops (auto-manage, capacity watches, autopilot) always name one: a
    # job already queued for a Lambda GPU must not change clouds under a
    # toggle. Change it on the Settings page, which validates the name
    # against the providers this backend actually registered.
    default_provider: lambda

hub:
  # The local half of Manifold: brains on this machine and frontier APIs.
  # Local model servers probed for brains (appear automatically when up).
  local_endpoints:
    - { name: ollama, base_url: "http://127.0.0.1:11434/v1" }
    - { name: lmstudio, base_url: "http://127.0.0.1:1234/v1" }
  # Frontier APIs usable as brains once their key env var is in .env.
  api_brains:
    - { name: claude, base_url: "https://api.anthropic.com/v1",
        model: claude-sonnet-4-5, api_key_env: ANTHROPIC_API_KEY }
    - { name: openai, base_url: "https://api.openai.com/v1",
        model: gpt-4o, api_key_env: OPENAI_API_KEY }
    - { name: gemini,
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai",
        model: gemini-2.5-pro, api_key_env: GEMINI_API_KEY }
  # Frontier CLIs offered as brains when installed + logged in (their own
  # official OAuth; Manifold never sees a token). Remove a name to hide it.
  cli_brains: [claude, codex, gemini]
  # The in-dashboard terminal on THIS machine (Hub page). Loopback-only and
  # origin-checked; set false to remove the endpoint entirely.
  local_terminal: true
  # A refresh (or frozen tab) no longer kills dock shells: the shell stays
  # alive waiting for the page to reattach. This is how long a DETACHED
  # shell waits before being reaped.
  #
  # It was 900 (15 minutes), on the reasoning that "a closed tab never comes
  # back". A frozen app is indistinguishable from a closed tab, and 15
  # minutes is shorter than a coffee break - so stepping away from a wedged
  # window killed whatever was running in the shell, agent sessions
  # included. 8 hours instead: a detached shell holds a pty and, for an
  # instance terminal, an SSH channel, and NOTHING else. It cannot keep a
  # GPU billing, because the idle sweep counts terminal INPUT as activity
  # and a detached shell produces none. The bound exists only so a machine
  # left running for weeks does not accumulate dead shells forever.
  #
  # Reaping is now recorded in the audit log and raises a notification, so
  # the one destructive thing this timer does is never silent again.
  terminal_grace_seconds: 28800

watches:
  # Capacity watches: poll the instance-types catalog on this interval.
  poll_seconds: 60
  # If false, a watch marked auto_launch only notifies; it never launches.
  auto_launch_enabled: false

diagnostics:
  # What the backend writes down about its own health. This section exists
  # because a freeze was reported three times and could not be investigated
  # even once: uvicorn logs to the terminal it was launched in, so every
  # occurrence erased its own evidence.
  #
  # Mirror logs into <data dir>/logs/manifold.log, rotating, 5 MB x 3.
  log_to_file: true
  # Log any request at or over this many seconds, with method and path. The
  # dashboard gives up at 30s and says "No answer after 30s (/instances)",
  # so this has to be well under that to catch the call it gave up on.
  # Afterwards the log answers the only question that matters first: is
  # there a slow_request line (the backend was slow) or none at all (the
  # backend answered fine and the browser stalled)?
  slow_request_seconds: 5.0
  # Log when the event loop oversleeps by this much. `await sleep(1)`
  # returning after 9 seconds means something synchronous held the loop for
  # 8 - the one condition that makes EVERY endpoint slow at once while each
  # handler still looks innocent. 0 disables the heartbeat.
  loop_lag_seconds: 1.0

telemetry:
  # How often the dispatcher records one GPU telemetry sample per connected
  # instance (peak VRAM, avg util). Backs the post-run utilization verdict
  # and right-size hint on the History page. Advisory only; reads the
  # sidecar over the existing managed connection, never the launch path.
  sample_seconds: 30

server:
  # Team mode (see docs/team-mode.md). The backend always REFUSES to serve
  # non-loopback requests when no API token is configured, and refuses
  # plain http from the network unless this is true. Set true only when
  # the wire is already encrypted below http - a Tailscale/WireGuard
  # tailnet is the canonical case. TLS via uvicorn --ssl-* needs no opt-in.
  allow_plaintext_lan: false

idle_spend:
  # Report-only accounting: how much of an instance's bill ran with its GPUs
  # essentially unused. It never terminates anything and never blocks
  # anything. Low utilization is not proof that nothing is happening - a
  # memory-bound job and a served model between requests both look idle - so
  # this is a number to look at, not a verdict.
  #
  # A sample counts as idle when the MEAN utilization across the box's GPUs
  # is at or below this. The mean, not the busiest card: on an 8-GPU box the
  # max would let one busy GPU hide seven idle ones.
  util_pct: 5
  # Instances shorter than this are not judged at all (boot plus noise).
  min_window_seconds: 600
  # The "this instance is idle" notification fires once per instance, and
  # only when BOTH are met: idle this long, and this much money in idle
  # spend. Set notify_usd higher if you would rather hear about it later.
  notify_after_seconds: 1800
  notify_usd: 1.0

auto_manage:
  # How often the auto-manage lifecycle loop advances a queued-then-launch job
  # (launch -> run -> sync -> terminate). Modest by default: while a job waits
  # for a free slot the only API call is the guarded request_launch; every
  # other step is a local DB read.
  poll_seconds: 5

database:
  path: manifold.db

storage:
  # Filesystems bill per GB-month for as long as they exist, and Lambda's
  # API publishes NO rate to read - so spend reports them as an ESTIMATE at
  # this rate, in their own block, never folded into the launch totals.
  # Write the rate from Lambda's current pricing page here; set 0 to switch
  # the estimate off rather than trust a number nobody vouched for.
  rate_usd_per_gb_month: 0.20

telemetry:
  # Sampling cadence for the per-instance GPU rows (see backend docs), and
  # how long those rows are kept. 30 days and not shorter: the max-lifetime
  # ceiling allows 30-day launches, and idle-spend accounting reads samples
  # across a launch's whole window - no live launch may outlive its own
  # telemetry. 0 keeps everything forever. The audit log is NEVER pruned.
  sample_seconds: 30
  retain_days: 30
